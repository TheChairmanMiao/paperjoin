<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#f3f3ef"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fcfbff"/>
    </linearGradient>
    <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#232136" flood-opacity=".14"/>
    </filter>
    <filter id="paper-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#3f388c" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="184" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <g transform="translate(242 223) scale(1.13)" stroke="#5850cb" stroke-width="26" stroke-linejoin="round">
    <rect x="0" y="0" width="304" height="400" rx="57" fill="#efedf9" transform="rotate(-9 152 200)"/>
    <rect x="160" y="96" width="304" height="400" rx="57" fill="url(#paper)" transform="rotate(6 312 296)" filter="url(#paper-shadow)"/>
  </g>
</svg>
